name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # A PR opened with GITHUB_TOKEN does not trigger the CI workflows, so
          # the required "checks" never run on it. Set the RELEASE_PLEASE_TOKEN
          # secret (a PAT or GitHub App token with contents + pull-requests
          # write) to have release PRs run CI by themselves.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
