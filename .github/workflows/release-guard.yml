name: release-guard

# Sulle PR verso main: la versione in testa a CHANGELOG.md deve essere nuova e maggiore dell'ultimo tag.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node .github/scripts/check-release-version.mjs
